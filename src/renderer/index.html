<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' ipc: http://ipc.localhost; img-src 'self' https: data: blob: file: asset: http://asset.localhost http://tauri.localhost; media-src 'self' file: https: blob: asset: http://asset.localhost; connect-src 'self' ipc: http://ipc.localhost https: wss: blob: data:; frame-src 'self' https: http:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
  <title>星云启动器</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="theme-refresh.css">
  <link rel="stylesheet" href="theme-apple.css">
  <link rel="stylesheet" href="ai-deepseek.css">
  <link rel="stylesheet" href="skin-center.css">
  <link rel="stylesheet" href="layout-fix.css">
  <link rel="stylesheet" href="mod-picker.css">
  <link rel="stylesheet" href="lab-tools.css">
</head>
<body>
  <!-- 背景光斑层（液态玻璃的折射底衬） -->
  <div class="bg-layer" aria-hidden="true">
    <img class="bg-media" id="bg-image" alt="" hidden>
    <video class="bg-media" id="bg-video" muted loop playsinline hidden></video>
    <canvas class="bg-canvas" id="bg-canvas" hidden></canvas>
    <i></i><i></i><i></i><i></i>
    <div class="bg-grid"></div>
  </div>

  <div class="app">
    <!-- 顶栏：logo + 搜索 + 启动 + 用户 -->
    <header class="topbar">
      <div class="topbar-drag"></div>
      <div class="brand">
        <img src="brand-icon.ico" style="width:28px;height:28px;border-radius:6px;object-fit:cover">
        <div class="brand-text">
          <div class="brand-name">星云启动器 <span>Nebula</span></div>
          <div class="brand-sub" data-i18n="brand.sub">星云之上，触手可及</div>
        </div>
      </div>

      <div class="topbar-search">
        <span class="search-ico">⌕</span>
        <input id="top-search" type="text" placeholder="搜索…" autocomplete="off" data-i18n-ph="topbar.search">
        <kbd>Ctrl K</kbd>
      </div>

      <div class="topbar-right">
        <button class="win-btn" id="top-ai" type="button" title="星云 AI · 聊天 / 翻译 / 装模组" style="font-size:16px">✨</button>
        <button class="win-btn" id="top-browser" type="button" title="内置浏览器 · MC 百科 / 找资源 / 登录" style="font-size:16px" data-i18n-title="topbar.browser">🌐</button>
        <button class="btn-launch-mini" id="top-launch" type="button" data-i18n="topbar.launch">▶ 启动</button>
        <div class="user-chip" id="top-user" title="点击前往账号页">
          <div class="user-avatar" id="top-avatar">👤</div>
          <div class="user-meta">
            <div class="user-name" id="top-username">未登录</div>
            <div class="user-type" id="top-usertype">点击登录</div>
          </div>
        </div>
        <div class="win-controls">
          <button class="win-btn" id="win-min" type="button" title="最小化" data-i18n-title="topbar.minimize">—</button>
          <button class="win-btn" id="win-max" type="button" title="最大化" data-i18n-title="topbar.maximize">▢</button>
          <button class="win-btn close" id="win-close" type="button" title="关闭" data-i18n-title="topbar.close">✕</button>
        </div>
      </div>
    </header>

    <div class="main-row">
      <!-- 左侧导航 -->
      <nav class="sidenav">
        <button class="nav-item active" data-page="home" type="button" aria-label="首页">
          <span class="nav-ico"><svg viewBox="0 0 20 20"><path d="M3.4 10.2 10 4.4l6.6 5.8"/><path d="M6 9.6V16h8V9.6"/></svg></span><span class="nav-label" data-i18n="nav.home">首页</span>
        </button>
        <button class="nav-item" data-page="instances" type="button" aria-label="实例管理">
          <span class="nav-ico"><svg viewBox="0 0 20 20"><rect x="3.4" y="3.4" width="6.2" height="6.2" rx="1.6"/><rect x="10.4" y="3.4" width="6.2" height="6.2" rx="1.6"/><rect x="3.4" y="10.4" width="6.2" height="6.2" rx="1.6"/><rect x="10.4" y="10.4" width="6.2" height="6.2" rx="1.6"/></svg></span><span class="nav-label" data-i18n="nav.instances">实例管理</span>
        </button>
        <button class="nav-item" data-page="versions" type="button" aria-label="版本管理">
          <span class="nav-ico"><svg viewBox="0 0 20 20"><path d="M10 3.6 16.6 7 10 10.4 3.4 7Z"/><path d="M4 10.4 10 13.6 16 10.4"/><path d="M4 13.6 10 16.8 16 13.6"/></svg></span><span class="nav-label" data-i18n="nav.versions">版本管理</span>
        </button>
        <button class="nav-item" data-page="center" type="button" aria-label="资源中心">
          <span class="nav-ico"><svg viewBox="0 0 20 20"><path d="M10 3.4 16.6 10 10 16.6 3.4 10Z"/><circle cx="10" cy="10" r="2.1"/></svg></span><span class="nav-label" data-i18n="nav.center">资源中心</span>
        </button>
        <button class="nav-item" data-page="servers" type="button" aria-label="联机大厅">
          <span class="nav-ico"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="6.4"/><path d="M3.8 10h12.4"/><path d="M10 3.6c2.4 2.2 2.4 10.6 0 12.8"/><path d="M10 3.6c-2.4 2.2-2.4 10.6 0 12.8"/></svg></span><span class="nav-label" data-i18n="nav.servers">联机大厅</span>
        </button>
        <button class="nav-item" data-page="lab" type="button" aria-label="星云实验室">
          <span class="nav-ico"><svg viewBox="0 0 20 20"><path d="M8.2 3.8h3.6"/><path d="M9.1 3.8v4.3L5.6 15a1.3 1.3 0 0 0 1.1 1.9h6.6a1.3 1.3 0 0 0 1.1-1.9L10.9 8.1V3.8"/></svg></span><span class="nav-label" data-i18n="nav.lab">星云实验室</span>
        </button>
        <button class="nav-item" data-page="account" type="button" aria-label="账号中心">
          <span class="nav-ico"><svg viewBox="0 0 20 20"><circle cx="10" cy="7.2" r="2.6"/><path d="M5.3 16.2c.6-2.6 2.4-3.9 4.7-3.9s4.1 1.3 4.7 3.9"/></svg></span><span class="nav-label" data-i18n="nav.account">账号中心</span>
        </button>
        <button class="nav-item" data-page="skins" type="button" aria-label="皮肤中心">
          <span class="nav-ico"><svg viewBox="0 0 20 20"><rect x="3.8" y="3.8" width="12.4" height="12.4" rx="2.2"/><circle cx="10" cy="8.4" r="1.7"/><path d="M6.7 14.2c.5-1.7 1.8-2.5 3.3-2.5s2.8.8 3.3 2.5"/></svg></span><span class="nav-label" data-i18n="nav.skins">皮肤中心</span>
        </button>
        <button class="nav-item" data-page="downloads" type="button" aria-label="下载与日志">
          <span class="nav-ico"><svg viewBox="0 0 20 20"><path d="M10 3.6v7.6"/><path d="M6.9 8.7 10 11.9l3.1-3.2"/><path d="M4.4 14.1v2.3h11.2v-2.3"/></svg></span><span class="nav-label" data-i18n="nav.downloads">下载与日志</span>
        </button>
        <button class="nav-item" data-page="tools" type="button" aria-label="工具箱">
          <span class="nav-ico"><svg viewBox="0 0 20 20"><path d="M12.6 3.4a4 4 0 0 0-4.1 5.2L3.8 13.3a1.7 1.7 0 0 0 2.4 2.4l4.7-4.7a4 4 0 0 0 5.2-4.1l-2.3 2.3-2.4-.5-.5-2.4z"/></svg></span><span class="nav-label" data-i18n="nav.tools">工具箱</span>
        </button>
        <button class="nav-item" data-page="settings" type="button" aria-label="设置">
          <span class="nav-ico"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="2.9"/><path d="M10 3.2v2.1M10 14.7v2.1M3.2 10h2.1M14.7 10h2.1M5.2 5.2l1.5 1.5M13.3 13.3l1.5 1.5M14.8 5.2l-1.5 1.5M6.7 13.3l-1.5 1.5"/></svg></span><span class="nav-label" data-i18n="nav.settings">设置</span>
        </button>

        <div class="sidenav-foot">
          <div class="foot-status" id="foot-status" title="Nebula Launcher 星云启动器"><span class="dot"></span><span id="foot-ver">运行正常</span></div>
          <div class="foot-license" data-i18n="foot.license">自研代码保留 · 第三方组件已署名</div>
        </div>
      </nav>

      <!-- 内容区 -->
      <main class="content" id="content">
        <!-- 页面由 JS 动态渲染 -->
      </main>
    </div>

    <!-- 手机端底部 Tab：仅在手机适配渲染器显示 -->
    <nav class="mobile-tabs" aria-label="移动端导航">
      <button class="nav-item active" data-page="home" type="button">
        <span class="nav-ico"><svg viewBox="0 0 20 20"><path d="M3.4 10.2 10 4.4l6.6 5.8"/><path d="M6 9.6V16h8V9.6"/></svg></span><span class="nav-label">首页</span>
      </button>
      <button class="nav-item" data-page="versions" type="button">
        <span class="nav-ico"><svg viewBox="0 0 20 20"><path d="M10 3.6 16.6 7 10 10.4 3.4 7Z"/><path d="M4 10.4 10 13.6 16 10.4"/><path d="M4 13.6 10 16.8 16 13.6"/></svg></span><span class="nav-label">版本</span>
      </button>
      <button class="nav-item" data-page="center" type="button">
        <span class="nav-ico"><svg viewBox="0 0 20 20"><path d="M10 3.4 16.6 10 10 16.6 3.4 10Z"/><circle cx="10" cy="10" r="2.1"/></svg></span><span class="nav-label">模组</span>
      </button>
      <button class="nav-item" data-page="downloads" type="button">
        <span class="nav-ico"><svg viewBox="0 0 20 20"><path d="M10 3.6v7.6"/><path d="M6.9 8.7 10 11.9l3.1-3.2"/><path d="M4.4 14.1v2.3h11.2v-2.3"/></svg></span><span class="nav-label">下载</span>
      </button>
      <button class="nav-item" data-page="settings" type="button">
        <span class="nav-ico"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="2.9"/><path d="M10 3.2v2.1M10 14.7v2.1M3.2 10h2.1M14.7 10h2.1M5.2 5.2l1.5 1.5M13.3 13.3l1.5 1.5M14.8 5.2l-1.5 1.5M6.7 13.3l-1.5 1.5"/></svg></span><span class="nav-label">设置</span>
      </button>
    </nav>
  </div>

  <!-- 顶部通知栈：灵动通知与加载胶囊共用同一列，按顺序向下叠放 -->
  <div class="notify-stack" id="notify-stack">
    <!-- 灵动通知：顶部正中的液态玻璃胶囊（实验功能，设置里开关）
         多条通知由 JS 动态插入 .island-list，最新一条在最上方 -->
    <div class="notify-island" id="notify-island" hidden>
      <div class="island-list" id="island-list"></div>
    </div>

    <!-- 全屏加载遮罩 -->
    <div class="global-loading" id="global-loading" hidden>
      <div class="spinner"></div>
      <div class="loading-text" id="loading-text" data-i18n="loading.text">加载中…</div>
    </div>
  </div>

  <!-- 拖拽导入遮罩 -->
  <div class="drop-overlay" id="drop-overlay" hidden>
    <div class="drop-box">
      <div class="drop-ico">📥</div>
      <div class="drop-title" data-i18n="drop.title">松开鼠标，智能导入</div>
      <div class="drop-sub" data-i18n="drop.sub">模组 · 资源包 · 光影 · 数据包 · 世界 · 整合包 · 投影</div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast" hidden></div>

  <script src="locales/zh-CN.js"></script>
  <script src="locales/zh-TW.js"></script>
  <script src="locales/en.js"></script>
  <script src="i18n.js"></script>
  <script src="api-adapter.js"></script>
  <script src="glass-motion.js"></script>
  <script src="voice.js"></script>
  <script src="wallpaper-fx.js"></script>
  <script src="app.js"></script>
  <!-- feat_*.js 由 app.js 的 loadFeatureScripts() 在首帧之后按原顺序异步加载 -->
</body>
</html>
